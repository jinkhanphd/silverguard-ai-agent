name: SilverGuard CI

on:
  push:
  pull_request:

jobs:
  risk-engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run risk engine tests
        run: node tests/risk-engine.test.js
